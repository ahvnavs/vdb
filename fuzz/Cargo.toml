[package]
name = "vdb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
vdb = { path = ".." }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network_message"
path = "fuzz_targets/network_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypted_envelope"
path = "fuzz_targets/encrypted_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mutation_verification"
path = "fuzz_targets/mutation_verification.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
